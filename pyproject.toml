[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-inside-the-block-analyzer"
version = "1.0.0"
description = "Solana Validator Transaction Ordering & Scheduler Analyzer (Post-Alpenglow Superteam Earn)"
readme = "README.md"
authors = [{ name = "duongynhi000005-oss" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pydantic>=2.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
solana-analyzer = "analyzer.cli:main"
